<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ffffff">
    <title>GOLF RADIO*</title>
    
    <link rel="icon" href="http://r.oddfuture.ru:4321/favicon.png" type="image/png">

    <style>
        /* --- ЛОКАЛЬНЫЕ ШРИФТЫ --- */
        @font-face {
            font-family: "Diagramatika";
            src: url("Diagramatika.ttf") format("truetype");
            font-weight: normal;
            font-style: normal;
        }
        @font-face {
            font-family: "JBMono";
            src: url("JBMono.ttf") format("truetype");
            font-weight: normal;
            font-style: normal;
        }
        
        :root { 
            --bg: #ffffff; 
            --text: #000000; 
            --surface: #f0f0f0; 
            --radius-top: 32px; 
            --radius-bottom: 16px; 
            --ease: cubic-bezier(0.16, 1, 0.3, 1); 
        }
        
        @media (prefers-color-scheme: dark) { 
            :root { 
                --bg: #050505; 
                --text: #ffffff; 
                --surface: #1a1a1a; 
            } 
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: "Diagramatika", sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            height: 100vh; 
            overflow: hidden; 
            transition: background 0.6s var(--ease), color 0.6s var(--ease); 
            display: flex; 
            flex-direction: column; 
        }
        
        /* --- ДВИЖУЩИЙСЯ ФОН (INFINITE TILING) --- */
        .ambient-wrapper {
            position: absolute;
            top: -50%; left: -50%; 
            width: 200%; height: 200%;
            z-index: 0;
            overflow: hidden;
            opacity: 0;
            transition: opacity 1.5s ease;
            /* Градиентная маска, чтобы низ уходил в цвет фона */
            mask-image: linear-gradient(to bottom, black 40%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 40%, transparent 100%);
            pointer-events: none;
        }
        
        .moving-bg {
            width: 100%; height: 100%;
            background-size: 500px 500px; /* Размер плитки */
            background-repeat: repeat;
            /* Анимация движения */
            animation: moveDiag 60s linear infinite;
            filter: blur(40px) saturate(1.2) brightness(0.8);
        }

        @keyframes moveDiag {
            from { transform: translate(0, 0); }
            to { transform: translate(-250px, -250px); } /* Сдвиг на половину плитки для бесшовности */
        }
        
        /* --- UI СЛОЙ --- */
        .ui-layer { position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column; padding: 24px; }
        
        .header { display: flex; justify-content: center; align-items: center; height: 60px; position: relative; }
        .logo { font-size: 2rem; letter-spacing: -0.03em; }
        .menu-btn { 
            position: absolute; right: 0; 
            font-family: "JBMono", monospace; font-size: 0.8rem; 
            cursor: pointer; padding: 10px 16px; 
            border-radius: 20px; 
            background: rgba(128,128,128,0.15); 
            backdrop-filter: blur(10px); 
            transition: 0.2s; 
            text-transform: uppercase; 
        }
        
        .stage { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 2.5rem; padding-bottom: 10vh; }
        
        /* КАРТОЧКА */
        .card { 
            width: 100%; max-width: 340px; aspect-ratio: 1/1; 
            background: var(--surface); 
            border-radius: var(--radius-top) var(--radius-top) var(--radius-bottom) var(--radius-bottom); 
            overflow: hidden; position: relative; 
            box-shadow: 0 30px 60px -15px rgba(0,0,0,0.25); 
            transition: 0.6s var(--ease); 
        }
        body.paused .card { transform: scale(0.92); box-shadow: 0 10px 20px -5px rgba(0,0,0,0.1); }
        
        .cover { width: 100%; height: 100%; background-size: cover; background-position: center; transition: 0.5s ease; opacity: 0; }
        body.playing .cover { transform: scale(1); } 
        body.paused .cover { transform: scale(1.05); }
        
        /* КНОПКИ И ТРОББЕР */
        .overlay { 
            position: absolute; inset: 0; 
            display: flex; justify-content: center; align-items: center; 
            cursor: pointer; 
            background: radial-gradient(circle, rgba(0,0,0,0.1) 0%, transparent 70%); 
        }
        
        .icon { 
            width: 72px; height: 72px; fill: #fff; 
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4)); 
            transition: 0.3s var(--ease); 
            position: absolute;
        }
        
        /* Троббер (Loader) */
        .loader {
            width: 60px; height: 60px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            position: absolute;
            opacity: 0;
            transition: opacity 0.3s;
            filter: drop-shadow(0 0 5px rgba(0,0,0,0.5));
        }
        .loader.active {
            opacity: 1;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Логика видимости кнопок */
        /* По умолчанию (Pause): Play виден, Pause скрыт, Loader скрыт */
        #i-play { opacity: 1; transform: scale(1); }
        #i-pause { opacity: 0; transform: scale(0.5); }
        
        /* Состояние: Playing (Играет) */
        body.playing #i-play { opacity: 0; transform: scale(0.5); }
        body.playing #i-pause { opacity: 0; transform: scale(1); } /* Скрыт, пока не наведешь */
        body.playing .overlay:hover #i-pause { opacity: 1; } /* На ПК при ховере */
        body.playing .overlay:active #i-pause { opacity: 1; } /* На таче при нажатии */

        /* Состояние: Loading (Грузится) */
        body.loading #i-play { opacity: 0; transform: scale(0.5); }
        body.loading #i-pause { opacity: 0; transform: scale(0.5); }
        
        /* ИНФОРМАЦИЯ О ТРЕКЕ */
        .info { text-align: center; display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 400px; padding: 0 10px; }
        
        .anim-text { transition: 0.4s var(--ease); opacity: 1; transform: translateY(0); } 
        .anim-text.out { opacity: 0; transform: translateY(10px); }
        
        .t-title { font-size: 2.5rem; line-height: 0.95; letter-spacing: -0.02em; }
        .t-artist { font-size: 1.4rem; opacity: 0.7; }
        /* JetBrains Mono для альбома - чтобы не прыгало */
        .t-album { 
            font-family: "JBMono", monospace; 
            font-size: 0.75rem; 
            opacity: 0.5; 
            text-transform: uppercase; 
            letter-spacing: 0.1em; 
            margin-top: 5px; 
            /* Фикс прыгания: фиксированная высота строки */
            min-height: 1.2em; 
        }
        
        /* SIDEBAR */
        .sidebar { 
            position: fixed; inset: 0; background: var(--bg); 
            z-index: 100; transform: translateX(100%); 
            transition: 0.5s var(--ease); 
            display: flex; flex-direction: column; padding: 30px; 
        }
        .sidebar.open { transform: translateX(0); }
        .sb-head { display: flex; justify-content: flex-end; margin-bottom: 2rem; } 
        .close { font-size: 2.5rem; cursor: pointer; line-height: 0.5; }
        .sb-title { font-family: "JBMono", monospace; font-size: 1rem; opacity: 0.4; margin-bottom: 1.5rem; border-bottom: 1px solid; display: inline-block; padding-bottom: 5px; text-transform: uppercase; }
        
        .list { list-style: none; overflow-y: auto; flex: 1; }
        .item { margin-bottom: 1.5rem; opacity: 0.5; transition: 0.2s; display: flex; flex-direction: column; gap: 2px;} 
        .item:first-child { opacity: 1; }
        
        .i-ti { font-family: "Diagramatika", sans-serif; font-size: 1.2rem; line-height: 1; } 
        .i-ar { font-family: "JBMono", monospace; font-size: 0.8rem; opacity: 0.7; }
        
        .credits { font-family: "JBMono", monospace; font-size: 0.7rem; opacity: 0.4; margin-top: 1rem; border-top: 1px solid rgba(128,128,128,0.2); padding-top: 1rem; line-height: 1.6; }
        .credits a { color: inherit; text-decoration: none; border-bottom: 1px dotted; }
        
        @media (min-width: 768px) { 
            .sidebar { width: 450px; left: auto; border-left: 1px solid rgba(128,128,128,0.1); } 
            .t-title { font-size: 4rem; } .t-artist { font-size: 2rem; } .card { max-width: 420px; }
        }
    </style>
</head>
<body class="paused">

    <div class="ambient-wrapper" id="bg-wrap">
        <div class="moving-bg" id="bg"></div>
    </div>

    <div class="ui-layer">
        <div class="header">
            <div class="logo">GOLF RADIO*</div>
            <div class="menu-btn" onclick="menu(true)">MENU</div>
        </div>

        <div class="stage">
            <div class="card">
                <div class="cover" id="cover"></div>
                <div class="overlay" id="btn">
                    <svg class="icon" id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <svg class="icon" id="i-pause" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    <div class="loader" id="loader"></div>
                </div>
            </div>

            <div class="info">
                <div class="t-title anim-text" id="tit">GOLF RADIO*</div>
                <div class="t-artist anim-text" id="art">нажмите, чтобы слушать</div>
                <div class="t-album anim-text" id="alb"></div>
            </div>
        </div>
    </div>

    <div class="sidebar" id="sb">
        <div class="sb-head"><div class="close" onclick="menu(false)">×</div></div>
        <div class="sb-title">ДАЛЕЕ В ЭФИРЕ</div>
        <ul class="list" id="list"><li class="item">Загрузка...</li></ul>
        <div class="credits">
            dev: <a href="https://t.me/vlcguy">@vlcguy</a><br>
            sup: <a href="https://t.me/tylerfme">@tylerfme</a><br>
            vibe: <a href="https://t.me/+VnzQr5tnePk5MDMy">golf for home</a>
        </div>
    </div>

    <audio id="audio" preload="none">
        <source src="http://r.oddfuture.ru:1234" type="audio/wav">
    </audio>

    <script>
        const API = "http://r.oddfuture.ru:4321"; 
        
        const el = (id) => document.getElementById(id);
        const audio = el('audio');
        let playing = false;
        let lastCov = "";

        // UI Элементы
        const bgWrap = el('bg-wrap');
        const bg = el('bg');
        const loader = el('loader');

        // КЛИК ПО КНОПКЕ
        el('btn').onclick = () => {
            if (playing) {
                // STOP
                audio.pause(); 
                audio.src = ""; 
                audio.load();
                setUI('paused');
            } else {
                // START
                setUI('loading'); // Сразу включаем троббер
                
                audio.src = "http://r.oddfuture.ru:1234";
                audio.load();
                
                // Промис воспроизведения
                audio.play()
                    .then(() => {
                        // Как только пошел звук (или буфер наполнился)
                        setUI('playing');
                    })
                    .catch(e => {
                        console.log("Play error:", e);
                        setUI('paused'); // Если ошибка - вернули паузу
                    });
            }
        };

        // СОСТОЯНИЯ ИНТЕРФЕЙСА
        function setUI(state) {
            document.body.className = state; // 'paused', 'loading', 'playing'
            
            if (state === 'playing') {
                playing = true;
                loader.classList.remove('active');
                fetchMeta();
            } else if (state === 'loading') {
                playing = false; // Технически еще не играем
                loader.classList.add('active');
            } else {
                playing = false;
                loader.classList.remove('active');
            }
        }

        // Данные
        function txt(id, val) {
            const d = el(id);
            if (d.innerText !== val) {
                d.classList.add('out');
                setTimeout(() => { d.innerText = val; d.classList.remove('out'); }, 400);
            }
        }

        async function fetchMeta() {
            if(!playing && document.body.className !== 'playing') return;
            try {
                const res = await fetch(`${API}/api/status`);
                const d = await res.json();

                if (d.state === 'paused') {
                    txt('tit', 'ЭФИР ОТКЛЮЧЕН');
                    txt('art', 'Техработы');
                    return;
                }

                txt('tit', d.title);
                txt('art', d.artist);
                txt('alb', d.album);

                if (d.cover && d.cover !== lastCov) {
                    lastCov = d.cover;
                    const img = new Image(); img.src = d.cover;
                    img.onload = () => {
                        // Ставим картинку в движущийся фон
                        bg.style.backgroundImage = `url('${d.cover}')`;
                        bgWrap.style.opacity = 1;
                        
                        // И в карточку
                        el('cover').style.backgroundImage = `url('${d.cover}')`;
                        el('cover').style.opacity = 1;
                    };
                } else if (!d.cover) {
                    bgWrap.style.opacity = 0;
                    el('cover').style.opacity = 0;
                }
            } catch(e) {}
        }

        async function loadQueue() {
            try {
                const res = await fetch(`${API}/api/queue`);
                const d = await res.json();
                const l = el('list'); l.innerHTML = "";
                if(!d.length) l.innerHTML = "<li class='item'>Пусто</li>";
                d.forEach(t => {
                    l.innerHTML += `<li class='item'><span class='i-ti'>${t.title}</span><span class='i-ar'>${t.artist}</span></li>`;
                });
            } catch(e){}
        }

        function menu(open) {
            const sb = el('sb');
            if(open) { sb.classList.add('open'); loadQueue(); }
            else sb.classList.remove('open');
        }

        setInterval(fetchMeta, 3000);
    </script>
</body>
</html>
