<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOLF RADIO*</title>
    <style>
        /* --- ШРИФТЫ --- */
        @font-face {
            font-family: "Diagramatika Display Regular";
            src: url("https://db.onlinewebfonts.com/t/2a046857838e215d46e580f8d8aa8543.eot");
            src: url("https://db.onlinewebfonts.com/t/2a046857838e215d46e580f8d8aa8543.eot?#iefix")format("embedded-opentype"),
            url("https://db.onlinewebfonts.com/t/2a046857838e215d46e580f8d8aa8543.woff2")format("woff2"),
            url("https://db.onlinewebfonts.com/t/2a046857838e215d46e580f8d8aa8543.woff")format("woff"),
            url("https://db.onlinewebfonts.com/t/2a046857838e215d46e580f8d8aa8543.ttf")format("truetype"),
            url("https://db.onlinewebfonts.com/t/2a046857838e215d46e580f8d8aa8543.svg#Diagramatika Display Regular")format("svg");
        }

        /* --- ЦВЕТА --- */
        :root {
            --bg-paused: #ffffff;
            --text-paused: #000000;
            --text-playing: #ffffff;
            --menu-bg: rgba(255, 255, 255, 0.95);
            --menu-text: #000000;
            --link-color: #ff0077;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-paused: #000000;
                --text-paused: #ffffff;
                --menu-bg: rgba(0, 0, 0, 0.95);
                --menu-text: #ffffff;
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Diagramatika Display Regular", sans-serif;
            height: 100vh; width: 100vw; overflow: hidden;
            background-color: var(--bg-paused);
            color: var(--text-paused);
            transition: background-color 0.6s ease, color 0.6s ease;
            position: relative;
        }

        /* --- ОБЛОЖКА --- */
        .cover-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            z-index: 1; filter: blur(30px) brightness(0.6);
            transform: scale(1.1); transition: opacity 1s ease, background-image 1s ease;
            opacity: 0;
        }

        /* --- КОНТЕЙНЕР --- */
        .container {
            position: relative; z-index: 2; height: 100%; width: 100%;
            display: flex; flex-direction: column;
            padding: 2rem;
        }

        .header {
            display: flex; justify-content: space-between; align-items: flex-start;
            width: 100%; position: relative;
        }

        .logo {
            font-size: 2.5rem; letter-spacing: -0.02em;
            position: relative; z-index: 5;
        }

        .menu-btn {
            font-size: 1.5rem; cursor: pointer;
            z-index: 20; user-select: none;
            text-transform: uppercase;
            padding: 5px 10px;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .player-wrapper {
            flex-grow: 1; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
            padding-bottom: 20%;
        }

        .play-btn {
            width: 80px; height: 80px; cursor: pointer; margin-bottom: 2rem;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .play-btn:active { transform: scale(0.9); }
        .play-btn svg { width: 100%; height: 100%; fill: currentColor; }

        body.playing .play-btn svg { drop-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        body.playing { color: var(--text-playing); }
        body.playing .cover-bg { opacity: 1; }
        body.playing .menu-btn { color: #fff; }

        .track-info { display: flex; flex-direction: column; gap: 0.5rem; }
        .track-title { font-size: 3rem; line-height: 1; }
        .track-artist { font-size: 1.8rem; opacity: 0.9; }
        .track-album { font-size: 1.2rem; opacity: 0.7; margin-top: 5px; }

        /* --- САЙДБАР --- */
        .sidebar {
            position: fixed; top: 0; right: 0;
            width: 100%; height: 100%;
            background-color: var(--menu-bg);
            color: var(--menu-text);
            backdrop-filter: blur(10px);
            z-index: 100;
            transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.77, 0, 0.175, 1);
            display: flex; flex-direction: column;
            padding: 2rem; overflow-y: auto;
        }
        .sidebar.open { transform: translateX(0); }
        .sidebar-header { display: flex; justify-content: flex-end; margin-bottom: 2rem; }
        .close-btn { font-size: 3rem; cursor: pointer; line-height: 0.8; }
        .queue-title { font-size: 2rem; margin-bottom: 1rem; border-bottom: 2px solid currentColor; display: inline-block; }
        .queue-list { list-style: none; margin-bottom: 3rem; }
        .queue-item { margin-bottom: 1rem; opacity: 0.8; font-size: 1.2rem; display: flex; flex-direction: column; }
        .q-artist { font-size: 0.9em; opacity: 0.7; }
        .q-title { font-weight: bold; }
        
        .credits {
            margin-top: auto; font-size: 1rem; line-height: 1.5; opacity: 0.8;
            padding-top: 2rem; border-top: 1px solid rgba(128,128,128,0.3);
        }
        .credits a { color: inherit; text-decoration: none; border-bottom: 1px dotted currentColor; }
        .credits a:hover { color: var(--link-color); border-bottom: 1px solid var(--link-color); }

        @media (min-width: 768px) {
            .container { max-width: 900px; margin: 0 auto; padding: 4rem; }
            .header { justify-content: center; }
            .logo { position: absolute; left: 50%; transform: translateX(-50%); width: auto; text-align: center; }
            .menu-btn { position: absolute; right: 0; top: 10px; }
            .logo { font-size: 3rem; }
            .track-title { font-size: 4.5rem; }
            .track-artist { font-size: 2.5rem; }
            .sidebar { width: 400px; border-left: 1px solid rgba(255,255,255,0.1); }
        }
    </style>
</head>
<body class="">

    <div class="cover-bg" id="coverBg"></div>

    <div class="container">
        <div class="header">
            <div class="logo">GOLF radio*</div>
            <div class="menu-btn" onclick="toggleMenu()">МЕНЮ</div>
        </div>

        <div class="player-wrapper">
            <div class="play-btn" id="playBtn">
                <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <svg id="icon-pause" viewBox="0 0 24 24" style="display: none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </div>

            <div class="track-info">
                <div class="track-title" id="title">GOLF RADIO*</div>
                <div class="track-artist" id="artist">нажмите, чтобы слушать</div>
                <div class="track-album" id="album"></div>
            </div>
        </div>
    </div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="close-btn" onclick="toggleMenu()">×</div>
        </div>
        
        <div class="queue-title">ДАЛЕЕ В ЭФИРЕ</div>
        <ul class="queue-list" id="queueList">
            <li class="queue-item">Загрузка...</li>
        </ul>

        <div class="credits">
            разработка: <a href="https://t.me/vlcguy" target="_blank">@vlcguy</a><br>
            при поддержке: <a href="https://t.me/tylerfme" target="_blank">@tylerfme</a><br>
            вайб: <a href="https://t.me/+VnzQr5tnePk5MDMy" target="_blank">golf for home</a><br>
            &lt;3
        </div>
    </div>

    <audio id="audioStream" preload="none">
        <source src="http://r.oddfuture.ru:1234" type="audio/wav">
    </audio>

    <script>
        const API_BASE = "http://r.oddfuture.ru:4321"; 
        
        const audio = document.getElementById('audioStream');
        const playBtn = document.getElementById('playBtn');
        const iconPlay = document.getElementById('icon-play');
        const iconPause = document.getElementById('icon-pause');
        const coverBg = document.getElementById('coverBg');
        const sidebar = document.getElementById('sidebar');
        const queueList = document.getElementById('queueList');
        
        const uiTitle = document.getElementById('title');
        const uiArtist = document.getElementById('artist');
        const uiAlbum = document.getElementById('album');

        let isPlaying = false;
        let lastCover = "";
        let menuOpen = false;

        // --- МЕНЮ ---
        function toggleMenu() {
            menuOpen = !menuOpen;
            if (menuOpen) {
                sidebar.classList.add('open');
                updateQueue();
            } else {
                sidebar.classList.remove('open');
            }
        }

        // --- ОЧЕРЕДЬ ---
        async function updateQueue() {
            try {
                const res = await fetch(`${API_BASE}/api/queue`);
                const data = await res.json();
                
                queueList.innerHTML = "";
                
                if (data.length === 0) {
                    queueList.innerHTML = "<li class='queue-item'>Конец плейлиста</li>";
                    return;
                }

                data.forEach(track => {
                    const li = document.createElement('li');
                    li.className = 'queue-item';
                    li.innerHTML = `<span class='q-title'>${track.title}</span><span class='q-artist'>${track.artist}</span>`;
                    queueList.appendChild(li);
                });
            } catch (e) {
                console.error("Queue Error:", e);
                queueList.innerHTML = "<li class='queue-item'>Ошибка загрузки</li>";
            }
        }

        // --- ПЛЕЕР ---
        function togglePlay() {
            if (isPlaying) {
                audio.pause();
                audio.src = ""; 
                audio.load();
                setUIState(false);
            } else {
                audio.src = "http://r.oddfuture.ru:1234";
                audio.load();
                audio.play().catch(e => console.log("Blocked:", e));
                setUIState(true);
            }
        }

        function setUIState(playing) {
            isPlaying = playing;
            if (playing) {
                document.body.classList.add('playing');
                iconPlay.style.display = 'none';
                iconPause.style.display = 'block';
                updateMetadata(); // Сразу грузим данные
            } else {
                document.body.classList.remove('playing');
                iconPlay.style.display = 'block';
                iconPause.style.display = 'none';
                // При паузе оставляем последнее название трека, не сбрасываем
            }
        }

        playBtn.addEventListener('click', togglePlay);

        // --- МЕТАДАННЫЕ ---
        async function updateMetadata() {
            if (!isPlaying) return; 

            try {
                const response = await fetch(`${API_BASE}/api/status`);
                const data = await response.json();

                if (data.state === "paused") {
                     uiTitle.innerText = "ЭФИР ОТКЛЮЧЕН";
                     uiArtist.innerText = "ведутся техработы";
                     return;
                }

                if (uiTitle.innerText !== data.title) {
                    uiTitle.innerText = data.title;
                    if (menuOpen) updateQueue(); 
                }
                if (uiArtist.innerText !== data.artist) uiArtist.innerText = data.artist;
                if (uiAlbum.innerText !== data.album) uiAlbum.innerText = data.album;

                if (data.cover && data.cover !== lastCover) {
                    lastCover = data.cover;
                    const img = new Image();
                    img.src = data.cover;
                    img.onload = () => {
                        coverBg.style.backgroundImage = `url('${data.cover}')`;
                    };
                } else if (!data.cover) {
                    coverBg.style.backgroundImage = "none";
                }

            } catch (e) {
                console.error("API Error:", e);
                // Опционально: можно писать "Слабый сигнал..." при ошибке сети
            }
        }

        setInterval(updateMetadata, 3000);
        // При загрузке UI уже в нужном состоянии (нажмите play)
    </script>
</body>
</html>
